<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Good Vibes</title>
<meta property="og:type" content="website">
<meta property="og:title" content="GOOD VIBES MF">
<meta property="og:url" content="https://michael-flores-sec.github.io/good-vibes/">
<meta property="og:image" content="https://michael-flores-sec.github.io/good-vibes/preview.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="GOOD VIBES MF">
<meta name="twitter:image" content="https://michael-flores-sec.github.io/good-vibes/preview.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --h:220;
  --bg:hsl(var(--h) 70% 38%); --fg:#FFFFFF; --soft:rgba(255,255,255,.72); --track:rgba(255,255,255,.18); --pop:#FFD23F;
  --display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:hsl(var(--h) 55% 18%); --fg:#EEF0FF; --soft:rgba(238,240,255,.68); --track:rgba(238,240,255,.16); --pop:#FFCE2E; color-scheme:dark; }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg); font-family:var(--mono);
  padding:max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(28px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  display:flex;
}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:0}
main{position:relative; z-index:1; max-width:640px; width:100%; margin:auto; display:flex; flex-direction:column; gap:22px}
.top{display:flex; justify-content:space-between; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; color:var(--soft)}
.count{font-variant-numeric:tabular-nums}
.card{display:flex; flex-direction:column; gap:20px; transition:opacity .3s ease}
.card.out{opacity:0}
@media (prefers-reduced-motion: reduce){ .card{transition:none} }
.gif{
  width:100%; aspect-ratio:4/3; max-height:52vh; border-radius:16px; overflow:hidden;
  background:var(--track); display:flex; align-items:center; justify-content:center;
}
.gif img{width:100%; height:100%; object-fit:cover; display:block}
h1{margin:0; font-family:var(--display); font-weight:700; font-size:clamp(30px,7vw,52px); line-height:1.08; letter-spacing:-.02em; text-wrap:balance}
.bar{height:4px; background:var(--track); border-radius:4px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--pop); transform-origin:left; transform:scaleX(0)}
.actions{display:flex; gap:10px; flex-wrap:wrap}
button{font:500 14px var(--mono); color:var(--fg); background:transparent; border:1.5px solid var(--track); border-radius:999px; padding:10px 18px; min-height:44px; cursor:pointer}
button.main{background:var(--fg); color:var(--bg); border-color:var(--fg)}
button:hover{border-color:var(--fg)}
button:focus-visible{outline:3px solid var(--pop); outline-offset:2px}
.status{margin:0; font-size:13px; color:var(--soft); min-height:1.3em}
.credit{margin:0; font-size:11px; color:var(--soft)}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <div class="top"><span>Good vibes MF</span><span class="count" id="count"></span></div>

  <div class="card" id="card" aria-live="polite">
    <div class="gif"><img id="gif" alt=""></div>
    <h1 id="line"></h1>
  </div>

  <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  <div class="actions">
    <button class="main" type="button" id="next">Next</button>
    <button type="button" id="pause" aria-pressed="false">Pause</button>
    <button type="button" id="copy">Copy</button>
  </div>
  <p class="status" id="status" role="status"></p></main>

<script>
const EVERY = 9000;

// rainbow background: slowly cycles through every color
(function(){
  const root=document.documentElement;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let h=220, last=performance.now();
  function spin(now){
    h=(h+(now-last)*0.012)%360; last=now;   // one full rainbow about every 30 seconds
    root.style.setProperty("--h",h.toFixed(1));
    requestAnimationFrame(spin);
  }
  if(!reduce) requestAnimationFrame(spin);
})();

const LINES = [
  "People trust you. You earned that.",
  "You're easy to talk to, and that's rare.",
  "You handle hard things better than you think.",
  "You're the friend people call when it matters.",
  "You notice things other people miss.",
  "Your work ethic shows.",
  "The group is better when you're there.",
  "You're funnier than you think.",
  "You keep your word. People notice.",
  "You've grown a lot this year.",
  "You have good instincts. Trust them more.",
  "You show up for people without being asked.",
  "You're honest without being harsh.",
  "You're more capable than you think.",
  "You're good company.",
  "You give good advice.",
  "You don't quit easily, and it shows.",
  "You're doing better than you think you are."
];

// GIPHY ids
const GIFS = [
  "TiciMUiN9evDdTxrBQ","1fa8ykgLv9Qff0i2Gq","8rg9n0PVhunFFNSKLK","lowAVZMKFjiJgrANvm",
  "ZxrpYTevDLmmY","X1Y4IHQO04VZS","H1llKCAzCACXak0x3f","23eIairmxdGSGK5pBx",
  "xUOrvVnIRJBU012e5i","3DITAPqFWt1z4NlgvA","etqTpcJe77YKaejaUE","b7FfIHOQWQuZjMABuG"
];
const gifUrl = id => `https://media.giphy.com/media/${id}/giphy.gif`;

const $ = id => document.getElementById(id);
const card=$("card"), line=$("line"), gif=$("gif"), fill=$("fill"), status=$("status"), count=$("count"), pauseBtn=$("pause");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
function makeDeck(src, prev){ const d=shuffle(src.slice()); if(d[0]===prev) d.push(d.shift()); return d; }

let lines=[], li=-1, gifs=[], gi=-1, seen=0, paused=false, startedAt=0, raf=null;
const dead = new Set();
function nextLineText(){ if(li+1>=lines.length){ lines=makeDeck(LINES, lines[li]); li=-1; } return lines[++li]; }
function nextGif(){
  for(let tries=0; tries<GIFS.length*2; tries++){
    if(gi+1>=gifs.length){ gifs=makeDeck(GIFS, gifs[gi]); gi=-1; }
    const id=gifs[++gi]; if(!dead.has(id)) return id;
  }
  return null;
}
// a GIF that fails to load gets skipped from then on
gif.addEventListener("error",()=>{ if(gif.dataset.id){ dead.add(gif.dataset.id); const id=nextGif(); if(id){ gif.dataset.id=id; gif.src=gifUrl(id); } } });

// preload the next GIF so it shows instantly
let queued = null;
function queueGif(){ queued = nextGif(); if(queued){ const im=new Image(); im.src=gifUrl(queued); } }

function show(animate){
  const text=nextLineText(), id = queued || nextGif();
  seen++; status.textContent="";
  count.textContent=`No. ${String(seen).padStart(3,"0")}`;
  const apply=()=>{ line.textContent=text; if(id){ gif.dataset.id=id; gif.src=gifUrl(id); } card.classList.remove("out"); queueGif(); };
  if(animate && !reduce){ card.classList.add("out"); setTimeout(apply,300); } else apply();
  if(animate && window.FXREADY) FX.show(3);
  restart();
}
function tick(){
  if(paused) return;
  const p=Math.min(1,(Date.now()-startedAt)/EVERY);
  fill.style.transform=`scaleX(${p})`;
  if(p>=1){ show(true); return; }
  raf=requestAnimationFrame(tick);
}
function restart(){ cancelAnimationFrame(raf); startedAt=Date.now(); fill.style.transform="scaleX(0)"; if(!paused) raf=requestAnimationFrame(tick); }

$("next").addEventListener("click",()=>show(true));
pauseBtn.addEventListener("click",()=>{
  paused=!paused; pauseBtn.textContent=paused?"Resume":"Pause"; pauseBtn.setAttribute("aria-pressed",paused);
  if(paused){ cancelAnimationFrame(raf); fill.style.transform="scaleX(0)"; } else restart();
});
$("copy").addEventListener("click",async()=>{
  const text = `${line.textContent}\n${gif.src}`;
  try{ await navigator.clipboard.writeText(text); status.textContent="Copied. Paste it in a text."; }
  catch(e){ status.textContent="Couldn't copy. Long-press the text to copy it."; }
});

show(false);

// fireworks: a burst with every new compliment, plus a few random ones
const FX = (function(){
  const c=document.getElementById("fx"), ctx=c.getContext("2d");
  const reduceFx=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W=0,H=0,dpr=1, parts=[], rockets=[], running=false;
  const BANDS=[[0.05,0.2],[0.33,0.48],[0.58,0.72]]; let bandIdx=Math.floor(Math.random()*3);
  function size(){ dpr=Math.min(2,window.devicePixelRatio||1); W=innerWidth; H=innerHeight; c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); }
  size(); addEventListener("resize",size);
  function burst(x,y){
    const hue=Math.random()*360, n=60+Math.floor(Math.random()*30);
    for(let i=0;i<n;i++){
      const a=Math.PI*2*i/n + Math.random()*0.2, sp=2+Math.random()*3.5;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:0.012+Math.random()*0.012,hue:hue+Math.random()*40-20});
    }
  }
  function launch(){
    if(reduceFx) return;
    const x=W*(0.15+Math.random()*0.7);
    const band=BANDS[(bandIdx++)%3];   // rotate top, middle, low
    rockets.push({x,y:H,vy:-(3+H*0.011+Math.random()*2),targetY:H*(band[0]+Math.random()*(band[1]-band[0]))});
    if(!running){ running=true; requestAnimationFrame(loop); }
  }
  function loop(){
    ctx.globalCompositeOperation="destination-out";
    ctx.fillStyle="rgba(0,0,0,0.22)"; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="lighter";
    rockets=rockets.filter(r=>{
      r.y+=r.vy; r.vy*=0.99;
      ctx.fillStyle="rgba(255,240,200,0.9)"; ctx.beginPath(); ctx.arc(r.x,r.y,2,0,Math.PI*2); ctx.fill();
      if(r.y<=r.targetY || r.vy>-2){ burst(r.x,r.y); return false; }
      return true;
    });
    parts=parts.filter(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vx*=0.98; p.vy=p.vy*0.98+0.05; p.life-=p.decay;
      if(p.life<=0) return false;
      ctx.fillStyle=`hsla(${p.hue},100%,65%,${p.life})`;
      ctx.beginPath(); ctx.arc(p.x,p.y,2.2*p.life+0.6,0,Math.PI*2); ctx.fill();
      return true;
    });
    if(rockets.length||parts.length) requestAnimationFrame(loop);
    else { running=false; ctx.clearRect(0,0,W,H); }
  }
  // a random extra firework now and then
  (function idle(){ setTimeout(()=>{ if(!document.hidden) launch(); idle(); }, 1500+Math.random()*2000); })();
  function show(n){ for(let i=0;i<n;i++) setTimeout(launch, i*250+Math.random()*150); }
  return {launch, show};
})();
FX.show(3);
window.FXREADY=true;
</script>
</body>
</html>
